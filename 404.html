<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#060a10" />
    <!-- Applies the saved theme before first paint. This page ships no scripts
         of its own, so this is all the JavaScript it needs; the storage key is
         shared with src/app.js — keep the two in sync. -->
    <script>
      try {
        if (localStorage.getItem("portfolio:theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').content = "#f4f7fb";
        }
      } catch (error) {
        /* storage blocked, as in private mode — dark is the default */
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />

    <title>Page not found — Aayush Kumar</title>
    <meta name="robots" content="noindex, follow" />
  </head>

  <body>
    <div class="backdrop-glow"></div>
    <div class="backdrop-grid"></div>

    <main class="flex min-h-screen items-center">
      <div class="mx-auto max-w-shell px-3 sm:px-5">
        <div class="win win-static mx-auto flex max-w-xl flex-col items-center gap-4 p-10 text-center">
          <p class="mono prompt text-xs text-muted">cd /nowhere</p>
          <h1 class="mono grad-text text-5xl font-bold">404</h1>
          <p class="mono text-sm text-ink">no such directory.</p>
          <p class="mono text-xs text-dim">
            the pane you were looking for was closed by the window manager.
          </p>
          <a href="/" class="btn btn-primary mt-2">back to home</a>
        </div>
      </div>
    </main>
  </body>
</html>
